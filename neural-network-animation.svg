  .edge-to-1 { animation: edgeSpot 4.8s ease-in-out infinite; animation-delay: 1.2s; }
  .edge-to-2 { animation: edgeSpot 4.8s ease-in-out infinite; animation-delay: 2.4s; }
  .edge-to-3 { animation: edgeSpot 4.8s ease-in-out infinite; animation-delay: 3.6s; }
  .label { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 9.5px; fill: #cbd5e1; }
  .cat { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #64748b; letter-spacing: 1.5px; }
  .tag { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #3b4657; }
</style>
