<style>
  .node { transform-box: fill-box; transform-origin: center; }
  .edge { fill: none; }
  @keyframes spot {
    0%, 18% { transform: scale(1.3); opacity: 1; }
    27%, 95% { transform: scale(0.8); opacity: 0.28; }
    100% { transform: scale(1.3); opacity: 1; }
  }
  @keyframes edgeSpot {
    0%, 18% { stroke-opacity: 0.55; }
    27%, 95% { stroke-opacity: 0.05; }
    100% { stroke-opacity: 0.55; }
  }
  .layer0 .node { animation: spot 4.8s ease-in-out infinite; animation-delay: 0s; }
  .layer1 .node { animation: spot 4.8s ease-in-out infinite; animation-delay: 1.2s; }
  .layer2 .node { animation: spot 4.8s ease-in-out infinite; animation-delay: 2.4s; }
