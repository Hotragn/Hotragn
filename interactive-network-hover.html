<title>How I turn skills into shipped work</title>
<style>
  body { margin: 0; background: #05070d; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
  .wrap { max-width: 960px; width: 100%; padding: 24px; }
  .diagram { width: 100%; }
  .diagram svg { width: 100%; height: auto; display: block; }
  figcaption { color: #64748b; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; text-align: center; margin-top: 10px; }

  .node { transform-box: fill-box; transform-origin: center; animation: spot 4.8s ease-in-out infinite; }
  .edge { fill: none; stroke-opacity: .1; animation: edgeSpot 4.8s ease-in-out infinite; }
  .layer0 .node { animation-delay: 0s; }
  .layer1 .node { animation-delay: 1.2s; }
  .layer2 .node { animation-delay: 2.4s; }
  .layer3 .node { animation-delay: 3.6s; }
  .edge-to-1 { animation-delay: 1.2s; }
  .edge-to-2 { animation-delay: 2.4s; }
  .edge-to-3 { animation-delay: 3.6s; }

  @keyframes spot {
    0%, 18% { transform: scale(1.3); opacity: 1; }
    27%, 95% { transform: scale(0.8); opacity: 0.28; }
    100% { transform: scale(1.3); opacity: 1; }
  }
  @keyframes edgeSpot {
    0%, 18% { stroke-opacity: 0.55; }
    27%, 95% { stroke-opacity: 0.05; }
    100% { stroke-opacity: 0.55; }
  }

  .plabel { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 9.5px; fill: #cbd5e1; transition: opacity .35s; }
  .cat { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #64748b; letter-spacing: 1.5px; transition: opacity .35s; }
  .pchip { transition: opacity .35s; }
  .tag { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #3b4657; }
  .hit { cursor: pointer; }

  .node { transition: transform .35s ease, opacity .35s ease; }
  .edge { transition: stroke-opacity .35s ease; }

  .diagram:has(.hit:hover) .node { animation-play-state: paused; opacity: .18; transform: scale(.72); }
  .diagram:has(.hit:hover) .edge { animation-play-state: paused; stroke-opacity: .03; }
  .diagram:has(.hit:hover) .plabel, .diagram:has(.hit:hover) .pchip, .diagram:has(.hit:hover) .cat { opacity: .22; }

  .diagram:has(.hit0:hover) .layer0 .node { opacity: 1; transform: scale(1.35); }
  .diagram:has(.hit0:hover) .edge-to-1 { stroke-opacity: .65; }
  .diagram:has(.hit0:hover) .l0-label { opacity: 1; }

  .diagram:has(.hit1:hover) .layer1 .node { opacity: 1; transform: scale(1.35); }
  .diagram:has(.hit1:hover) .edge-to-1, .diagram:has(.hit1:hover) .edge-to-2 { stroke-opacity: .65; }
  .diagram:has(.hit1:hover) .l1-label { opacity: 1; }

  .diagram:has(.hit2:hover) .layer2 .node { opacity: 1; transform: scale(1.35); }
  .diagram:has(.hit2:hover) .edge-to-2, .diagram:has(.hit2:hover) .edge-to-3 { stroke-opacity: .65; }
  .diagram:has(.hit2:hover) .l2-label { opacity: 1; }

  .diagram:has(.hit3:hover) .layer3 .node { opacity: 1; transform: scale(1.35); }
  .diagram:has(.hit3:hover) .edge-to-3 { stroke-opacity: .65; }
  .diagram:has(.hit3:hover) .l3-label { opacity: 1; }
</style>
